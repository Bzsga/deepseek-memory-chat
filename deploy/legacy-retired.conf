# Retired development products. The unified APK has its existing update channel.
location = /deepseek-chat { return 302 /deepseek/; }
location ^~ /deepseek-chat/ { return 302 /deepseek/; }
location = /deepseek-chat-updates { return 302 /deepseek/download; }
location ^~ /deepseek-chat-updates/ { return 302 /deepseek/download; }
location = /continuation-api { return 410; }
location ^~ /continuation-api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 '{"error":"APP_MERGED","download":"https://digimonlegend.com/deepseek/download"}';
}
