# Unified DeepSeek routes. Existing unrelated locations stay untouched.
location = /deepseek { return 308 /deepseek/; }
location = /deepseek/admin { return 302 /deepseek-api/admin; }
location = /deepseek/download {
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3144/download;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_cache off;
}
location ^~ /deepseek/share/ {
    proxy_pass http://127.0.0.1:3144/chat/public-shares/;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    limit_except GET HEAD { deny all; }
}
location ^~ /deepseek/ {
    # The build uses content hashes for JS and CSS; leave HTML and API responses uncached.
    location ~ "^/deepseek/(static/(?:js|css)/(?:async/)?[A-Za-z0-9_.-]+\.[a-f0-9]{8,}\.(?:js|css))$" {
        alias /opt/deepseek/current/web/dist/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }
    alias /opt/deepseek/current/web/dist/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    limit_except GET HEAD { deny all; }
}
location = /deepseek-api { return 308 /deepseek-api/; }
location ^~ /deepseek-api/ {
    proxy_pass http://127.0.0.1:3144/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 70m;
    client_body_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 330s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
