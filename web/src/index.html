<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>DeepSeek 聊天</title>
    <script>
      window.addEventListener('error', function (event) {
        var source = event.target && event.target.tagName === 'SCRIPT' && event.target.getAttribute('src');
        if (!source || !/^static\/js\/main\.[a-f0-9]{8}\.js$/.test(source)) return;
        try { sessionStorage.setItem('deepseek-startup-entry-failure', Math.floor(Date.now() / 1000)); }
        catch (_) { /* Storage can be blocked. */ }
      }, true);
    </script>
    <style>
      /* Startup must remain usable when a JavaScript or stylesheet request fails. */
      .session-bootstrap {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        color: #394257;
        background: #fff;
        font: 15px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      .session-bootstrap[hidden] { display: none; }
      .session-bootstrap p { margin: 0; }
      .session-bootstrap details { width: min(380px, 100%); text-align: left; }
      .session-bootstrap pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      .session-bootstrap button {
        min-height: 40px;
        padding: 8px 22px;
        border: 0;
        border-radius: 10px;
        background: #4d6bfe;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        .session-bootstrap { color: #e5e7eb; background: #292a2d; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="session-bootstrap" class="session-bootstrap" role="status">
      <p>正在加载 DeepSeek 记忆聊天…</p>
      <form method="get" onsubmit="window.location.reload(); return false">
        <button type="submit">重新加载</button>
      </form>
    </div>
  </body>
</html>
